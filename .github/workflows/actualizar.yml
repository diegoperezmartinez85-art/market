name: Actualizar precios

on:
  schedule:
    - cron: "17 10 * * *"     # todos los días 7:17 (hora de Argentina)
  workflow_dispatch:           # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
    paths:
      - ".github/workflows/actualizar.yml"
      - ".github/nexos/**"
      - "productos.json"         # cuando subís productos nuevos: páginas y precios en minutos

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Revisar precios y regenerar páginas
        id: run
        run: python .github/nexos/actualizar_nube.py

      - name: Publicar cambios
        if: success()
        run: |
          git config user.name "nexos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A productos.json sitemap.xml robots.txt p
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Precios actualizados $(TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main
