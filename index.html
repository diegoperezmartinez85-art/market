<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f1316">
    <title>Nexos Market</title>
    <meta name="description" content="Nexos Market: ofertas, novedades y productos que bajaron de precio. Buscá por nombre, categoría o precio y comprá directo.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Nexos Market">
    <meta property="og:locale" content="es_AR">
    <meta property="og:title" content="Nexos Market">
    <meta property="og:description" content="Ofertas, novedades y productos que bajaron de precio.">
    <!-- IMPORTANTE: al publicar, reemplazá por la dirección completa, ej.: https://tusitio.com/logo.jpg -->
    <meta property="og:image" content="logo.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <style>
        :root {
            --bg: #0f1316;
            --surface: #171b1f;
            --surface-2: #1e2328;
            --line: #2a3036;
            --text: #f4f6f8;
            --muted: #98a2ad;
            --cyan: #0da9d9;
            --blue: #3a6df0;
            --violet: #7a2fd6;
            --magenta: #df005b;
            --brand: linear-gradient(90deg, var(--cyan), var(--blue) 35%, var(--violet) 68%, var(--magenta));
            /* Zona de productos (clara) */
            --page: #ffffff;
            --ink: #111827;
            --ink-muted: #5b6672;
            --card-line: #e3e7eb;
            --action: #2f5fe3;
            --action-hover: #244fc4;
        }
        * { box-sizing: border-box; margin: 0; }
        body {
            background: var(--page);
            color: var(--ink);
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            min-height: 100vh;
            line-height: 1.45;
        }

        header { position: relative; background: var(--bg); padding: 6px 20px 0; display: flow-root; /* contiene el margen del logo: sin franja blanca */ }
        /* Todo el encabezado (logo + buscador + categorías) queda fijo arriba.
           Al bajar, el logo y la fila de dólar/clima se achican de a poco (--k va de 0 a 1,
           lo calcula el script según el scroll) para que no ocupen media pantalla. */
        .top { position: sticky; top: 0; z-index: 10; background: var(--bg); }
        .bar {
            position: relative;
            background: var(--bg); border-bottom: 1px solid var(--line);
            padding: 2px 20px 14px;
        }
        .bar::after {
            content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
            background: var(--brand);
        }
        /* Logo grande con borde neón (degradé de la marca + resplandor que respira) */
        .logo-frame {
            position: relative; isolation: isolate;
            width: min(460px, 100%);
            margin: 8px auto 10px; padding: 2px;
            border-radius: 18px; background: var(--brand);
            box-shadow: 0 0 6px rgba(13,169,217,.55), 0 0 16px rgba(122,47,214,.35);
        }
        .logo-frame::before {
            content: ""; position: absolute; inset: -3px; z-index: -1; border-radius: 22px;
            background: var(--brand); filter: blur(14px); opacity: .6;
            animation: neonPulse 3.6s ease-in-out infinite;
        }
        @keyframes neonPulse { 50% { opacity: .95; filter: blur(18px); } }
        @media (prefers-reduced-motion: reduce) { .logo-frame::before { animation: none; } }
        .logo {
            display: block; width: 100%; height: auto; aspect-ratio: 4 / 1;
            object-fit: cover; border-radius: 16px; background: var(--bg);
        }
        /* Fila de extras del header: dólar (corre) + clima.
           Celular/tablet: una fila bajo el logo. Escritorio ancho: cada uno en su esquina. */
        .hdr-row { display: flex; align-items: center; gap: 8px; margin: 6px 0 0; }
        @media (max-width: 1099px) {   /* celular/tablet: la fila se pliega al scrollear */
            .hdr-row { margin-top: calc(6px * (1 - var(--k, 0))); max-height: calc(48px * (1 - var(--k, 0)));
                       opacity: calc(1 - var(--k, 0) * 1.6); overflow: hidden; }
            .top.k-full .hdr-row { visibility: hidden; }
        }
        .pill {
            display: flex; align-items: center; gap: 8px; min-width: 0;
            background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
            color: var(--text); line-height: 1;
        }
        .pill[hidden] { display: none; }

        .weather { margin-left: auto; flex: 0 0 auto; padding: 0 12px 0 8px; position: relative; cursor: pointer; }
        .weather .w-ico { font-size: 1.3rem; }
        .weather .w-temp { font-size: 1.05rem; font-weight: 700; }
        .weather .w-city { display: block; font-size: .68rem; color: var(--muted); margin-top: 3px; font-weight: 500;
                           max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .weather .w-sel { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border-radius: 999px; }
        .weather .w-sel option { color: #111; background: #fff; }
        .weather:focus-within { outline: 2px solid var(--blue); outline-offset: 2px; }

        .ticker, .weather { height: 42px; }
        .ticker { flex: 1 1 auto; padding: 0 12px 0 10px; overflow: hidden; }
        .ticker .t-ico { flex: 0 0 auto; font-size: 1.15rem; }
        .ticker .t-view {
            flex: 1 1 auto; min-width: 0; overflow: hidden; position: relative;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent);
                    mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent);
        }
        .ticker .t-track { display: flex; width: max-content; will-change: transform;
                           animation: tickerMove var(--t-dur, 30s) linear infinite; }
        .ticker .t-set { display: flex; flex: 0 0 auto; }
        .ticker .t-item { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap;
                          padding-right: 22px; font-size: .88rem; }
        .ticker .t-name { font-weight: 700; color: var(--cyan); font-size: .78rem; letter-spacing: .02em; }
        .ticker .t-val { font-weight: 600; font-variant-numeric: tabular-nums; }
        .ticker .t-sep { color: var(--muted); font-weight: 400; }
        @keyframes tickerMove { to { transform: translateX(-50%); } }   /* de derecha a izquierda */
        @media (hover: hover) { .ticker:hover .t-track { animation-play-state: paused; } }   /* solo con mouse: en celular el hover se queda "pegado" */
        .ticker:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
        .ticker.pausado .t-track { animation-play-state: paused; }   /* pausa manual: clic, toque o Enter */
        .ticker { cursor: pointer; }

        @media (min-width: 1100px) {
            .hdr-row { display: block; margin: 0; }
            .ticker, .weather { position: absolute; top: 16px; z-index: 2; margin: 0; }
            .ticker { left: 20px; width: min(340px, calc((100vw - 460px) / 2 - 40px)); flex: none; }
            .weather { right: 20px; padding: 0 14px 0 10px; }
            .weather .w-ico { font-size: 1.6rem; }
        }
        .search { max-width: 640px; margin: 0 auto; position: relative; display: flex; gap: 8px; }
        .search input {
            flex: 1 1 0; min-width: 0; width: 100%; padding: 11px 16px;
            background: var(--surface-2); color: var(--text);
            border: 1px solid var(--line); border-radius: 10px;
            font: inherit; outline: none;
        }
        .search input::placeholder { color: var(--muted); }
        .search select {
            flex: 0 0 auto; max-width: 46%; padding: 11px 10px; cursor: pointer;
            background: var(--surface-2); color: var(--text);
            border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: .9rem; outline: none;
        }
        .search select option { color: #111; background: #fff; }
        .filters-btn {
            display: none; flex: 0 0 auto; position: relative; cursor: pointer; align-items: center; justify-content: center;
            min-width: 44px; padding: 0 12px; background: var(--surface-2); color: var(--text);
            border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 1.1rem; line-height: 1;
        }
        .filters-btn[aria-expanded="true"] { border-color: var(--blue); }
        .filters-btn.has::after { content: ""; position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--magenta); }
        .filters-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
        .search select:focus-visible { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(58,109,240,.35); }
        .search input:focus-visible { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(58,109,240,.35); }

        .cats {
            max-width: 1200px; margin: 10px auto 0; display: flex; gap: 8px;
            overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: thin;
        }
        .cats button {
            flex: 0 0 auto; cursor: pointer; font: inherit; font-size: .85rem;
            background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
            border-radius: 999px; padding: 5px 14px; white-space: nowrap;
        }
        .cats button:hover { border-color: var(--blue); }
        .cats button.on { background: var(--brand); border-color: transparent; color: #fff; font-weight: 600; }
        .cats button small { opacity: .7; margin-left: 4px; }

        .filters {
            max-width: 640px; margin: 8px auto 0; display: flex; align-items: center; justify-content: center;
            gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--muted);
        }
        .filters input {
            width: 112px; padding: 7px 10px; background: var(--surface-2); color: var(--text);
            border: 1px solid var(--line); border-radius: 8px; font: inherit; outline: none;
        }
        .filters input::placeholder { color: var(--muted); }
        .filters input:focus-visible { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(58,109,240,.35); }
        .filters .clear {
            cursor: pointer; font: inherit; font-size: .8rem; color: var(--text);
            background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
        }
        .filters .clear:hover { border-color: var(--blue); }
        .filters .clear[hidden] { display: none; }
        .more-wrap { text-align: center; margin-top: 28px; }
        .more-wrap[hidden] { display: none; }
        .more-btn {
            cursor: pointer; font: inherit; font-weight: 600; color: #fff; background: var(--action);
            border: 0; border-radius: 10px; padding: 12px 28px; transition: background .15s;
        }
        .more-btn:hover { background: var(--action-hover); }
        .more-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

        main { max-width: 1200px; margin: 0 auto; padding: 28px 20px 56px; }
        #count { color: var(--ink-muted); font-size: .9rem; margin-bottom: 16px; }

        #productGrid {
            display: grid; gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        }
        /* Borde azul con resplandor suave (el mismo azul del botón) */
        .card {
            border: 2px solid var(--action); border-radius: 14px;
            background: #fff;
            overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 0 6px rgba(47,95,227,.40), 0 0 14px rgba(47,95,227,.18);
            transition: box-shadow .15s, transform .15s;
        }
        .card:hover { box-shadow: 0 0 8px rgba(47,95,227,.65), 0 0 22px rgba(47,95,227,.35); transform: translateY(-2px); }
        @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
        .card .thumb { background: #fff; aspect-ratio: 1 / 1; display: block; position: relative; overflow: hidden; border-bottom: 1px solid var(--card-line); }
        .card .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
        .card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .chip {
            align-self: flex-start; font-size: .75rem; color: #1a56c9; background: #eef3fe;
            border: 1px solid #cddcfb; border-radius: 999px; padding: 2px 10px;
        }
        .card h2 {
            font-size: 1rem; font-weight: 600; color: var(--ink);
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        .card { scroll-margin-top: calc(var(--bar-h, 120px) + 16px); }
        .card.nuevo { outline: 3px solid #df005b; outline-offset: 2px; }
        .card .thumb { position: relative; }
        .card .thumb .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 30px;
            border: 0; border-radius: 50%; background: rgba(15,19,22,.65); color: #fff; font-size: 18px;
            line-height: 1; cursor: pointer; opacity: 0; transition: opacity .15s; }
        .card .thumb .nav.prev { left: 8px; } .card .thumb .nav.next { right: 8px; }
        .card:hover .thumb .nav, .card .thumb .nav:focus-visible { opacity: 1; }
        @media (hover: none) { .card .thumb .nav { opacity: .85; } }
        .card .thumb .dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; gap: 5px; justify-content: center; }
        .card .thumb .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(15,19,22,.25); }
        .card .thumb .dots i.on { background: #df005b; }
        .price { font-size: 1.4rem; font-weight: 700; margin-top: auto; }
        .btn {
            display: block; text-align: center; text-decoration: none;
            background: var(--action); color: #fff; font-weight: 600;
            padding: 11px 12px; border-radius: 10px; margin-top: 6px;
            transition: background .15s;
        }
        .btn:hover { background: var(--action-hover); }
        .code { font: 600 12px/1 ui-monospace, Consolas, monospace; color: var(--ink-muted); letter-spacing: .04em; }
        .card.caido .thumb img { filter: grayscale(1); opacity: .45; }
        .card.caido { background: #fff; border-color: var(--card-line); box-shadow: 0 1px 2px rgba(17,24,39,.05); }
        .card.caido h2, .card.caido .price { opacity: .55; }
        .badge-off { position: absolute; top: 10px; left: 10px; z-index: 2; background: #8a1c3d; color: #fff;
                     font: 700 12px/1 system-ui, sans-serif; padding: 6px 10px; border-radius: 999px; }
        .btn.btn-off { background: #eceff2; color: #6b7580; cursor: not-allowed; pointer-events: none; }
        .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

        .empty { grid-column: 1 / -1; text-align: center; color: var(--ink-muted); padding: 48px 0; }
        /* ---- Novedades / Bajó de precio ---- */
        #destacados { margin-bottom: 8px; }
        .sec-title { font-size: 1.15rem; font-weight: 700; margin: 8px 0 12px; }
        .strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px;
                 padding: 12px 0 22px; margin: 0 0 6px; }
        /* ---- Etiquetas, precio anterior ---- */
        .badges { position: absolute; top: 10px; left: 10px; z-index: 2; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
        .tag { font: 700 12px/1 system-ui, sans-serif; padding: 6px 10px; border-radius: 999px; color: #fff; }
        .tag.new { background: #c4004f; }
        .tag.drop { background: #0f7a3f; }
        .price { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
        .price .save { flex-basis: 100%; font-size: .8rem; font-weight: 600; color: #0f7a3f; }
        .price .was { font-size: .9rem; font-weight: 400; color: var(--ink-muted); text-decoration: line-through; }
        /* ---- Favoritos y WhatsApp ---- */
        .fav { position: absolute; top: 8px; right: 8px; z-index: 3; width: 36px; height: 36px; border-radius: 50%;
               border: 1px solid var(--card-line); background: rgba(255,255,255,.92); color: #6b7580; font-size: 20px; line-height: 1; cursor: pointer; }
        .fav:hover { color: #c4004f; }
        .fav[aria-pressed="true"] { color: #c4004f; border-color: #c4004f; }
        .fav:focus-visible, .wa:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
        .wa { display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-weight: 600; font-size: .85rem; white-space: nowrap;
              color: #14683f; border: 1.5px solid #14683f; border-radius: 10px; padding: 8px 6px; background: #fff; }
        .wa:hover { background: #ecf8f1; }
        .wa svg { width: 18px; height: 18px; fill: currentColor; }
        .empty .retry { display: inline-block; margin-top: 14px; padding: 10px 18px; border: 0; border-radius: 10px;
                        background: var(--action); color: #fff; font: 600 1rem inherit; cursor: pointer; }
        .empty small { display: block; margin-top: 12px; font-size: .8rem; opacity: .8; }

        /* ============ Responsive: celular, tablet y PC ============ */
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        button, a, select, input { touch-action: manipulation; }
        img { max-width: 100%; }
        header, .bar { padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }
        main { padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }
        .weather .w-sel { font-size: 16px; }   /* iOS no hace zoom al abrir el selector */

        .wa-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .card { container-type: inline-size; }
        @container (max-width: 275px) { .wa-x { display: none; } }   /* tarjeta angosta: solo "Compartir" */

        /* Tablet */
        @media (max-width: 900px) {
            #productGrid, .strip { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
        }

        /* Celular */
        @media (max-width: 640px) {
            header, .bar { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
            .bar { padding-bottom: 10px; }
            main { padding: 16px max(12px, env(safe-area-inset-right)) 40px max(12px, env(safe-area-inset-left)); }
            .logo-frame { margin: 6px auto 8px; border-radius: 14px; }
            .logo { border-radius: 12px; }
            .ticker, .weather { height: 38px; }
            .weather .w-city { max-width: 84px; }
            .ticker .t-item { font-size: .82rem; }

            .search { gap: 6px; }
            .search input { padding: 10px 12px; font-size: 16px; }
            .search select { max-width: 42%; padding: 10px 6px; font-size: 16px; }
            .filters { flex-wrap: nowrap; justify-content: stretch; gap: 6px; margin-top: 8px; font-size: .8rem; }
            .filters input { flex: 1 1 0; min-width: 0; width: auto; padding: 8px 8px; font-size: 16px; }
            .filters .clear { flex: 0 0 auto; padding: 6px 10px; }
            .cats { margin: 8px -12px 0; padding: 2px 12px 4px; gap: 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
            .cats::-webkit-scrollbar { display: none; }
            .cats button { padding: 7px 14px; font-size: .85rem; }

            #count { font-size: .85rem; margin-bottom: 12px; }
            #productGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .card { border-radius: 12px; }
            .card:hover { transform: none; }
            .card .body { padding: 10px 10px 12px; gap: 6px; }
            .card h2 { font-size: .86rem; -webkit-line-clamp: 3; line-height: 1.3; }
            .chip { font-size: .68rem; padding: 2px 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .code { font-size: 11px; }
            .price { font-size: 1.1rem; }
            .price .was { font-size: .78rem; }
            .btn { padding: 10px 6px; font-size: .84rem; line-height: 1.25; border-radius: 9px; }
            .wa { font-size: .8rem; padding: 9px 4px; border-radius: 9px; }
            .wa svg { width: 16px; height: 16px; }
            .fav { width: 40px; height: 40px; top: 6px; right: 6px; }
            .card .thumb .nav { width: 34px; height: 34px; }
            .card .thumb .nav.prev { left: 4px; } .card .thumb .nav.next { right: 4px; }
            .badges { top: 6px; left: 6px; gap: 4px; }
            .tag, .badge-off { font-size: 10.5px; padding: 5px 8px; }
            .badge-off { top: 6px; left: 6px; }

            .sec-title { font-size: 1.05rem; margin: 4px 0 10px; }
            .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0 0 12px; padding: 4px 0 12px; }
            .wa-x { display: none; }   /* en tarjetas angostas: solo "Compartir" */
            .more-btn { width: 100%; padding: 14px 16px; }
            .empty { padding: 32px 0; }
        }

        /* Celular: el filtro de precio queda detrás del botón de filtros */
        @media (max-width: 640px) {
            .filters-btn { display: inline-flex; }
            .filters:not(.open) { display: none; }
        }
        /* Botón volver arriba */
        .to-top {
            position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 20;
            width: 46px; height: 46px; border: 0; border-radius: 50%; cursor: pointer;
            background: var(--action); color: #fff; font-size: 22px; line-height: 1;
            box-shadow: 0 4px 14px rgba(0,0,0,.3);
            opacity: 0; visibility: hidden; transform: translateY(8px); transition: opacity .2s, transform .2s, visibility .2s;
        }
        .to-top.show { opacity: 1; visibility: visible; transform: none; }
        .to-top:hover { background: var(--action-hover); }
        .to-top:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { .to-top { transition: none; } }

        /* Celulares muy angostos */
        @media (max-width: 340px) {
            #productGrid, .strip { grid-template-columns: 1fr; }
        }

        /* PC grande */
        @media (min-width: 1400px) {
            main, .cats { max-width: 1360px; }
            #productGrid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
            .strip { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
        }
        @media (min-width: 1100px) {
            .card .thumb img { padding: 6px; }
        }
    </style>
</head>
<body>

    <div class="top" id="top">
    <header>
        <div class="logo-frame"><img class="logo" src="logo.jpg" width="640" height="160" alt="Nexos Market" fetchpriority="high" decoding="async"></div>
        <div class="hdr-row">
            <div class="pill ticker" id="ticker" hidden role="region" aria-label="Cotización del dólar" tabindex="0">
                <span class="t-ico" aria-hidden="true">&#128181;</span>
                <div class="t-view"><div class="t-track" id="tTrack"></div></div>
            </div>
            <label class="pill weather" id="weather" hidden title="Clima: tocá para cambiar de provincia">
                <span class="w-ico" id="wIco" aria-hidden="true"></span>
                <span><span class="w-temp" id="wTemp"></span><small class="w-city" id="wCity"></small></span>
                <select class="w-sel" id="wSel" aria-label="Elegir provincia para el clima"></select>
            </label>
        </div>
    </header>
    <div class="bar">
        <div class="search">
            <input type="search" id="searchInput" placeholder="Buscar productos" aria-label="Buscar productos" autocomplete="off">
            <select id="sortSelect" aria-label="Ordenar por precio">
                <option value="">Orden original</option>
                <option value="new">Más nuevos</option>
                <option value="asc">Menor precio</option>
                <option value="desc">Mayor precio</option>
                <option value="az">Nombre A-Z</option>
            </select>
            <button type="button" class="filters-btn" id="filtersBtn" aria-expanded="false" aria-controls="filtersBox" aria-label="Filtrar por precio" title="Filtrar por precio">&#9881;</button>
        </div>
        <div class="filters" id="filtersBox">
            <span>Precio</span>
            <input type="number" id="priceMin" min="0" inputmode="numeric" placeholder="Mín $" aria-label="Precio mínimo">
            <span aria-hidden="true">&ndash;</span>
            <input type="number" id="priceMax" min="0" inputmode="numeric" placeholder="Máx $" aria-label="Precio máximo">
            <button type="button" class="clear" id="priceClear" hidden>Limpiar</button>
        </div>
        <nav class="cats" id="cats" aria-label="Categorías"></nav>
    </div>
    </div>

    <main>
        <div id="destacados"></div>
        <p id="count" aria-live="polite"></p>
        <div id="productGrid"></div>
        <div class="more-wrap" id="moreWrap" hidden><button type="button" class="more-btn" id="moreBtn"></button></div>
    </main>
    <button type="button" class="to-top" id="toTop" aria-label="Volver arriba" title="Volver arriba">&#8593;</button>

    <script>
        // Altura real del encabezado fijo (logo + buscador + categorías): evita que tape la tarjeta resaltada.
        const topEl = document.getElementById('top');
        function updateBarH() {
            document.documentElement.style.setProperty('--bar-h', topEl.offsetHeight + 'px');
        }
        updateBarH();
        if (window.ResizeObserver) new ResizeObserver(updateBarH).observe(topEl);
        else addEventListener('resize', updateBarH);

        // Encabezado siempre visible: se achica de a poco con el scroll (0 = completo, 1 = compacto).
        const toTopBtn = document.getElementById('toTop');
        toTopBtn.addEventListener('click', () => scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }));
        (function () {
            const RANGE = 110;   // píxeles de scroll hasta quedar compacto
            let pend = false;
            function update() {
                pend = false;
                const k = Math.min(1, Math.max(0, (window.scrollY || 0) / RANGE));
                topEl.style.setProperty('--k', k.toFixed(3));
                topEl.classList.toggle('k-full', k >= 1);
                toTopBtn.classList.toggle('show', (window.scrollY || 0) > 600);
            }
            addEventListener('scroll', function () {
                if (!pend) { pend = true; requestAnimationFrame(update); }
            }, { passive: true });
            update();
        })();

        let allProducts = [];
        // Producto recién agregado (borde de color). Se guarda acá para que NO se pierda
        // cada vez que la grilla se vuelve a armar (al tocar una categoría, buscar, etc.).
        let destacadoId = new URLSearchParams(location.search).get('nuevo');

        const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#eef0f2"/>' +
            '<text x="150" y="158" font-family="sans-serif" font-size="18" fill="#98a2ad" text-anchor="middle">Sin imagen</text></svg>'
        );

        // Acepta el formato plano (id, name, price, image, link...) y el formato
        // antiguo del script (product_details + affiliate_url).
        // Texto para comparar: sin tildes ni mayúsculas ("cámara" == "camara").
        const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        const DIAS_NUEVO = 14, DIAS_BAJA = 21;
        function reciente(fecha, dias) {
            if (!fecha) return false;
            const d = new Date(fecha + 'T00:00:00');
            if (isNaN(d)) return false;
            const edad = (Date.now() - d.getTime()) / 864e5;
            return edad >= -1 && edad <= dias;
        }
        const esNuevo = p => reciente(p.added, DIAS_NUEVO);
        const bajoPrecio = p => p.prev != null && p.price != null && p.prev > p.price && reciente(p.drop, DIAS_BAJA);
        const pctBaja = p => Math.round((1 - p.price / p.prev) * 100);

        function normalize(raw, index) {
            const p = normalizeBase(raw, index);
            p.added = raw.added || '';
            p.prev = raw.prev_price != null ? Number(raw.prev_price) : null;
            p.drop = raw.price_drop || '';
            p._h = norm(p.name + ' ' + p.category + ' ' + p.code);
            return p;
        }
        function normalizeBase(raw, index) {
            if (raw.product_details) {
                const d = raw.product_details;
                return {
                    _n: index,
                    id: d.ml_id || index,
                    code: '',
                    status: 'ok',
                    name: d.title || 'Producto',
                    category: d.category || 'Otros',
                    price: Number(d.price) || null,
                    currency: d.currency || 'ARS',
                    image: d.hd_image || '',
                    images: d.hd_image ? [d.hd_image] : [],
                    link: raw.affiliate_url || '#'
                };
            }
            return {
                _n: index,
                id: raw.id ?? index,
                code: raw.code || '',
                status: raw.status === 'no_disponible' ? 'no_disponible' : 'ok',
                name: raw.name || 'Producto',
                category: raw.category || 'Otros',
                price: raw.price != null ? Number(raw.price) : null,
                currency: raw.currency || 'ARS',
                image: raw.image || '',
                images: (Array.isArray(raw.images) && raw.images.length ? raw.images : (raw.image ? [raw.image] : []))
                    .filter(u => typeof u === 'string' && u),
                link: raw.link || '#'
            };
        }

        function fmtMoney(v, cur) {
            try {
                return new Intl.NumberFormat('es-AR', {
                    style: 'currency', currency: cur, maximumFractionDigits: 2
                }).format(v);
            } catch (e) {
                return '$' + v.toFixed(2);
            }
        }
        function formatPrice(p) {
            if (p.price == null || isNaN(p.price)) return 'Consultar precio';
            return fmtMoney(p.price, p.currency);
        }

        // ---- Favoritos (guardados en este navegador) ----
        const FAV_KEY = 'nexos_favs';
        let favs = new Set();
        try { favs = new Set((JSON.parse(localStorage.getItem(FAV_KEY) || '[]') || []).map(String)); } catch (e) {}
        function saveFavs() { try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch (e) {} }
        let soloFavs = false;
        function contarEvento(path, title) {
            if (!GOATCOUNTER || !window.goatcounter || !window.goatcounter.count) return;
            window.goatcounter.count({ path: path, title: title || path, event: true });
        }
        function toggleFav(id, name) {
            id = String(id);
            const on = !favs.has(id);
            if (on) favs.add(id); else favs.delete(id);
            saveFavs();
            document.querySelectorAll('.fav[data-fav="' + id + '"]').forEach(b => {
                b.setAttribute('aria-pressed', on);
                b.title = on ? 'Quitar de favoritos' : 'Guardar en favoritos'; b.setAttribute('aria-label', b.title);
            });
            if (on) contarEvento('favorito/' + id, name);
            renderCats();
            if (soloFavs) applyFilter(false);
        }

        // ---- Compartir por WhatsApp ----
        const WA_SVG = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C9 3 3.4 8.6 3.4 15.5c0 2.2.6 4.4 1.7 6.3L3 29l7.4-1.9c1.8 1 3.8 1.500 5.800 1.500 7 0 12.600-5.600 12.600-12.500S23 3 16 3zm0 22.900c-1.900 0-3.700-.5-5.300-1.500l-.4-.2-4.400 1.100 1.200-4.300-.3-.4a10.300 10.300 0 0 1-1.600-5.500C5.200 9.800 10 5.100 16 5.100s10.800 4.700 10.800 10.500S22 25.900 16 25.900zm5.900-7.700c-.3-.2-1.900-.9-2.200-1-.3-.1-.5-.2-.7.200-.2.300-.8 1-.9 1.200-.2.200-.3.200-.6.100-.3-.2-1.400-.5-2.600-1.600-1-.9-1.600-1.900-1.800-2.200-.2-.3 0-.5.100-.7l.5-.5c.1-.2.200-.3.300-.5.100-.2 0-.4 0-.5 0-.2-.7-1.700-1-2.300-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.100-.8.400-.3.300-1 1-1 2.500s1.100 2.900 1.200 3.100c.2.200 2.100 3.300 5.200 4.500 3.100 1.200 3.100.8 3.600.8.600-.1 1.900-.8 2.200-1.500.3-.7.300-1.400.2-1.500-.1-.2-.3-.2-.6-.4z"/></svg>';
        function waLink(p) {
            const base = location.href.split(/[?#]/)[0];
            const precio = (p.price == null || isNaN(p.price)) ? '' : ' - ' + formatPrice(p);
            const txt = 'Mirá este producto en Nexos Market: ' + p.name + precio + '\n' + base + '?nuevo=' + encodeURIComponent(p.id);
            return 'https://wa.me/?text=' + encodeURIComponent(txt);
        }

        function escapeHTML(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // Foto principal + (si el producto trae más) flechitas para ver las otras.
        // Si una foto no carga se descarta; si ninguna carga, queda el cartel "Sin imagen".
        function setupGallery(card, p) {
            const thumb = card.querySelector('.thumb');
            const img = thumb.querySelector('img');
            let pics = (p.images && p.images.length ? p.images : (p.image ? [p.image] : [])).slice();
            let i = 0;
            const dots = document.createElement('div');
            dots.className = 'dots';
            const prev = document.createElement('button');
            const next = document.createElement('button');
            prev.className = 'nav prev'; next.className = 'nav next';
            prev.type = next.type = 'button';
            prev.textContent = '\u2039'; next.textContent = '\u203A';
            prev.setAttribute('aria-label', 'Foto anterior');
            next.setAttribute('aria-label', 'Foto siguiente');
            function paint() {
                if (!pics.length) { img.src = PLACEHOLDER; prev.remove(); next.remove(); dots.remove(); return; }
                i = (i + pics.length) % pics.length;
                img.src = pics[i];
                if (pics.length > 1) {
                    dots.innerHTML = pics.map((_, k) => '<i class="' + (k === i ? 'on' : '') + '"></i>').join('');
                    if (!prev.isConnected) thumb.append(prev, next, dots);
                } else { prev.remove(); next.remove(); dots.remove(); }
            }
            prev.addEventListener('click', () => { i--; paint(); });
            next.addEventListener('click', () => { i++; paint(); });
            img.addEventListener('error', () => {
                if (!pics.length || img.src === PLACEHOLDER) return;
                pics.splice(i, 1);          // esta foto no carga: la saco y muestro la siguiente
                paint();
            });
            if (pics.length > 1) paint();
        }

        // Paginación: se muestran de a PAGE productos y un botón "Mostrar más".
        const PAGE = 30;
        let visibles = PAGE;
        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            const count = document.getElementById('count');
            const moreWrap = document.getElementById('moreWrap');
            grid.innerHTML = '';
            moreWrap.hidden = true;

            if (products.length === 0) {
                count.textContent = '';
                grid.innerHTML = soloFavs
                    ? '<p class="empty">Todavía no guardaste favoritos. Tocá el corazón &#9829; de un producto para guardarlo acá.</p>'
                    : allProducts.length
                    ? '<p class="empty">No encontramos productos con esos filtros. Probá con otra palabra o ampliá el precio.</p>'
                    : '<p class="empty">Todavía no hay productos cargados.</p>';
                return;
            }
            const total = products.length;
            const tanda = products.slice(0, visibles);
            const totalTxt = total === 1 ? '1 producto' : total + ' productos';
            count.textContent = tanda.length < total ? 'Mostrando ' + tanda.length + ' de ' + totalTxt : totalTxt;
            if (tanda.length < total) {
                const resto = total - tanda.length;
                document.getElementById('moreBtn').textContent =
                    'Mostrar más productos (' + (resto > PAGE ? 'siguientes ' + PAGE : 'quedan ' + resto) + ')';
                moreWrap.hidden = false;
            }

            tanda.forEach(p => grid.appendChild(buildCard(p)));
        }

        function buildCard(p) {
            const card = document.createElement('article');
            card.className = 'card';
            card.dataset.id = p.id;
            const caido = p.status === 'no_disponible';
            if (caido) card.classList.add('caido');
            if (destacadoId !== null && String(p.id) === String(destacadoId)) card.classList.add('nuevo');
            const baja = !caido && bajoPrecio(p);
            const tags = caido ? '<span class="badge-off">No disponible</span>'
                : ((esNuevo(p) || baja) ? '<span class="badges">' + (esNuevo(p) ? '<span class="tag new">Nuevo</span>' : '') +
                    (baja ? '<span class="tag drop">Bajó ' + pctBaja(p) + '%</span>' : '') + '</span>' : '');
            const esFav = favs.has(String(p.id));
            card.innerHTML = `
                <div class="thumb">${tags}<button type="button" class="fav" data-fav="${escapeHTML(p.id)}" data-name="${escapeHTML(p.name)}" aria-pressed="${esFav}" aria-label="${esFav ? 'Quitar de favoritos' : 'Guardar en favoritos'}" title="${esFav ? 'Quitar de favoritos' : 'Guardar en favoritos'}">&#9829;</button><img src="${escapeHTML(p.image || PLACEHOLDER)}" alt="${escapeHTML(p.name)}" loading="lazy" decoding="async" width="300" height="300" referrerpolicy="no-referrer"></div>
                <div class="body">
                    <span class="chip">${escapeHTML(p.category)}</span>${p.code ? ' <span class="code">' + escapeHTML(p.code) + '</span>' : ''}
                    <h2>${escapeHTML(p.name)}</h2>
                    <p class="price">${formatPrice(p)}${baja ? '<span class="was">' + fmtMoney(p.prev, p.currency) + '</span><span class="save">Ahorrás ' + fmtMoney(p.prev - p.price, p.currency) + '</span>' : ''}</p>
                    ${caido
                        ? '<span class="btn btn-off" aria-disabled="true">Publicación no disponible</span>'
                        : `<a class="btn" data-track="${escapeHTML(p.code || p.id)}" data-name="${escapeHTML(p.name)}" href="${escapeHTML(p.link)}" target="_blank" rel="noopener noreferrer sponsored">Ver oferta en Mercado Libre</a>
                           <a class="wa" data-ev="compartir" data-track="${escapeHTML(p.code || p.id)}" data-name="${escapeHTML(p.name)}" href="${escapeHTML(waLink(p))}" target="_blank" rel="noopener noreferrer">${WA_SVG}<span class="wa-t">Compartir<span class="wa-x"> por WhatsApp</span></span></a>`}
                </div>`;
            setupGallery(card, p);
            return card;
        }

        // Franjas de arriba de todo: "Bajó de precio" y "Novedades" (solo sin búsqueda ni filtros).
        function calcFranjas() {
            const ok = allProducts.filter(p => p.status !== 'no_disponible');
            const nuevos = ok.filter(esNuevo).sort((x, y) => (y.added > x.added ? 1 : y.added < x.added ? -1 : y._n - x._n)).slice(0, 12);
            const bajas = ok.filter(bajoPrecio).sort((x, y) => pctBaja(y) - pctBaja(x)).slice(0, 12);
            return { nuevos, bajas };
        }
        function renderDestacados(f) {
            const box = document.getElementById('destacados');
            box.innerHTML = '';
            if (!f) return;
            const franja = (titulo, lista) => {
                if (!lista.length) return;
                const h = document.createElement('h2'); h.className = 'sec-title'; h.textContent = titulo;
                const st = document.createElement('div'); st.className = 'strip';
                lista.forEach(p => st.appendChild(buildCard(p)));
                box.append(h, st);
            };
            franja('Bajó de precio', f.bajas);
            franja('Novedades', f.nuevos);
            if (box.children.length) {
                const h = document.createElement('h2'); h.className = 'sec-title'; h.textContent = 'Más productos';
                box.appendChild(h);
            }
        }

        async function fetchProducts() {
            const grid = document.getElementById('productGrid');
            if (!allProducts.length) grid.innerHTML = '<p class="empty">Cargando productos…</p>';
            try {
                const response = await fetch('productos.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const raw = await response.text();
                const data = JSON.parse(raw);
                if (!Array.isArray(data)) throw new Error('formato inesperado');
                lastRaw = raw;
                allProducts = data.map(normalize);
                renderCats();
                applyFilter();
                resaltarNuevo();
            } catch (error) {
                console.error('Error cargando productos:', error);
                // Mensaje para el público; la pista técnica solo se ve en tu PC.
                const tecnica = (ES_LOCAL || location.protocol === 'file:')
                    ? '<small>Para vos: abrí la tienda con iniciar.bat (o con "python -m http.server") en lugar de hacer doble clic en index.html.</small>' : '';
                grid.innerHTML = '<div class="empty" role="alert"><p><strong>No pudimos cargar los productos en este momento.</strong></p>' +
                    '<p>Revisá tu conexión e intentá de nuevo. Si sigue sin andar, volvé a probar en unos minutos.</p>' +
                    '<button type="button" class="retry" id="retryBtn">Reintentar</button>' + tecnica + '</div>';
                document.getElementById('count').textContent = '';
                document.getElementById('moreWrap').hidden = true;
                document.getElementById('retryBtn').addEventListener('click', fetchProducts);
            }
        }

        // Abierto desde el Gestor (?nuevo=ID): se desplaza al producto recien agregado y lo resalta.
        const NUEVO = new URLSearchParams(location.search).get('nuevo');
        let nuevoMostrado = false;
        function resaltarNuevo() {
            if (NUEVO === null || nuevoMostrado) return;
            const card = [...document.querySelectorAll('#destacados .card, #productGrid .card')]
                .find(c => c.dataset.id === NUEVO);
            if (!card) return;
            nuevoMostrado = true;
            card.classList.add('nuevo');
            updateBarH(); card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Producto agregado mientras la tienda está abierta: se muestra y queda marcado (hasta que se agregue otro o se recargue).
        function resaltarId(id) {
            // el producto nuevo tiene que verse: se limpian búsqueda, categoría y precio
            activeCat = ''; document.getElementById('searchInput').value = '';
            document.getElementById('priceMin').value = ''; document.getElementById('priceMax').value = '';
            destacadoId = id; expandirDestacado = true;
            renderCats(); applyFilter(false);
            const card = [...document.querySelectorAll('#destacados .card, #productGrid .card')].find(c => c.dataset.id === id);
            if (!card) return;
            document.querySelectorAll('.card.nuevo').forEach(c => c.classList.remove('nuevo'));
            card.classList.add('nuevo');
            updateBarH(); card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Categorías: se generan solas a partir de los productos cargados.
        const guardado = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
        const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
        let activeCat = new URLSearchParams(location.search).get('nuevo') === null ? guardado('nexos_cat') : '';
        function renderCats() {
            const counts = {};
            allProducts.forEach(p => { counts[p.category] = (counts[p.category] || 0) + 1; });
            const names = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'es'));
            if (activeCat && !counts[activeCat]) activeCat = '';
            if (allProducts.length) guardar('nexos_cat', activeCat);
            const nav = document.getElementById('cats');
            nav.innerHTML = '';
            const mk = (label, value, n) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = (value === activeCat && !soloFavs) ? 'on' : '';
                b.innerHTML = escapeHTML(label) + '<small>' + n + '</small>';
                b.addEventListener('click', () => { activeCat = value; soloFavs = false; renderCats(); applyFilter(); });
                nav.appendChild(b);
            };
            mk('Todas', '', allProducts.length);
            const nFav = allProducts.filter(p => favs.has(String(p.id))).length;
            const bf = document.createElement('button');
            bf.type = 'button';
            bf.className = soloFavs ? 'on' : '';
            bf.innerHTML = '&#9829; Favoritos<small>' + nFav + '</small>';
            bf.addEventListener('click', () => { soloFavs = !soloFavs; activeCat = ''; renderCats(); applyFilter(); });
            nav.appendChild(bf);
            names.forEach(n => mk(n, n, counts[n]));
        }

        // Si hay que mostrar el producto recién agregado, se amplía la página una sola vez para incluirlo.
        let expandirDestacado = destacadoId !== null;
        // reset=false (lo usa el chequeo automático) conserva cuántos productos ya se habían desplegado.
        function applyFilter(reset) {
            if (reset !== false) visibles = PAGE;
            const terminos = norm(document.getElementById('searchInput').value).split(/\s+/).filter(Boolean);
            const min = parseFloat(document.getElementById('priceMin').value);
            const max = parseFloat(document.getElementById('priceMax').value);
            const hayPrecio = !isNaN(min) || !isNaN(max);
            document.getElementById('priceClear').hidden = !hayPrecio;
            if (typeof filtersBtn !== 'undefined') filtersBtn.classList.toggle('has', hayPrecio);
            const lista = allProducts.filter(p =>
                (!activeCat || p.category === activeCat) &&
                (!soloFavs || favs.has(String(p.id))) &&
                // búsqueda sin tildes y por varias palabras: tienen que estar todas (en cualquier orden)
                terminos.every(t => p._h.includes(t)) &&
                // con filtro de precio, los "Consultar precio" (sin precio) quedan afuera
                (!hayPrecio || (p.price != null && !isNaN(p.price) &&
                    (isNaN(min) || p.price >= min) && (isNaN(max) || p.price <= max)))
            );
            // Orden: los no disponibles siempre al final; luego el elegido (sort estable).
            // En el orden por precio, los "Consultar precio" van al final en ambos sentidos.
            const orden = document.getElementById('sortSelect').value;
            lista.sort((a, b) => {
                const na = a.status === 'no_disponible', nb = b.status === 'no_disponible';
                if (na !== nb) return na ? 1 : -1;
                if (orden === 'new') return b._n - a._n;
                if (orden === 'az') return a.name.localeCompare(b.name, 'es', { sensitivity: 'base' });
                if (orden === 'asc' || orden === 'desc') {
                    const sa = a.price == null || isNaN(a.price), sb = b.price == null || isNaN(b.price);
                    if (sa || sb) return sa - sb;
                    return orden === 'asc' ? a.price - b.price : b.price - a.price;
                }
                return 0;
            });
            if (expandirDestacado && destacadoId !== null) {
                const i = lista.findIndex(p => String(p.id) === String(destacadoId));
                if (i >= 0) { visibles = Math.max(visibles, i + 1); expandirDestacado = false; }
            }
            // Un producto que ya está en una franja (Novedades / Bajó de precio) no se repite abajo.
            // Si las franjas se llevarían todos los productos, no se muestran y queda solo la lista.
            let franjas = null, resto = lista;
            if (!terminos.length && !hayPrecio && !activeCat && !soloFavs) {
                const f = calcFranjas();
                const enFranja = new Set([...f.bajas, ...f.nuevos].map(p => p.id));
                const sobran = lista.filter(p => !enFranja.has(p.id));
                if (enFranja.size && sobran.length) { franjas = f; resto = sobran; }
            }
            renderDestacados(franjas);
            displayProducts(resto);
            // búsquedas sin resultado: sirven para saber qué te piden y no tenés
            clearTimeout(aplicarFiltro.t);
            if (!lista.length && terminos.length && allProducts.length)
                aplicarFiltro.t = setTimeout(() => contarEvento('busqueda-sin-resultados/' + terminos.join(' ')), 1500);
        }
        const aplicarFiltro = {};
        // Buscar/filtrar con una pausa de 200 ms: no se rearma la grilla en cada letra.
        let debT;
        const aplicarConPausa = () => { clearTimeout(debT); debT = setTimeout(() => applyFilter(), 200); };
        const sortSel = document.getElementById('sortSelect');
        const ordenGuardado = guardado('nexos_sort');
        if ([...sortSel.options].some(o => o.value === ordenGuardado)) sortSel.value = ordenGuardado;
        document.getElementById('searchInput').addEventListener('input', aplicarConPausa);
        sortSel.addEventListener('change', () => { guardar('nexos_sort', sortSel.value); applyFilter(); });
        document.getElementById('priceMin').addEventListener('input', aplicarConPausa);
        document.getElementById('priceMax').addEventListener('input', aplicarConPausa);
        const filtersBtn = document.getElementById('filtersBtn'), filtersBox = document.getElementById('filtersBox');
        filtersBtn.addEventListener('click', () => {
            const abierto = filtersBox.classList.toggle('open');
            filtersBtn.setAttribute('aria-expanded', abierto);
        });
        document.getElementById('priceClear').addEventListener('click', () => {
            document.getElementById('priceMin').value = ''; document.getElementById('priceMax').value = '';
            applyFilter();
        });
        document.getElementById('moreBtn').addEventListener('click', () => {
            visibles += PAGE;
            applyFilter(false);
        });

        // Clics en "Ver oferta": si completás GOATCOUNTER (ver GUIA_PUBLICAR.md) se cuentan por producto.
        const GOATCOUNTER = '';   // ej.: 'nexosmarket'  ->  nexosmarket.goatcounter.com
        if (GOATCOUNTER) {
            const gc = document.createElement('script');
            gc.async = true;
            gc.dataset.goatcounter = 'https://' + GOATCOUNTER + '.goatcounter.com/count';
            gc.src = 'https://gc.zgo.at/count.js';
            document.head.appendChild(gc);
        }
        function contarClick(e) {
            const a = e.target.closest && e.target.closest('a[data-track]');
            if (!a) return;
            contarEvento((a.dataset.ev || 'compra') + '/' + a.dataset.track, a.dataset.name);
        }
        function clickFav(e) {
            const b = e.target.closest && e.target.closest('.fav');
            if (b) toggleFav(b.dataset.fav, b.dataset.name);
        }
        ['productGrid', 'destacados'].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('click', contarClick);
            el.addEventListener('auxclick', contarClick);   // clic del medio
            el.addEventListener('click', clickFav);
        });

        // Si agregás o eliminás productos con el Gestor, la tienda se actualiza sola.
        let lastRaw = null;
        async function pollProducts() {
            try {
                const r = await fetch('productos.json', { cache: 'no-store' });
                if (!r.ok) return;
                const raw = await r.text();
                if (lastRaw === null || raw !== lastRaw) {
                    const primera = lastRaw === null;   // la carga inicial había fallado
                    const antes = new Set(allProducts.map(p => String(p.id)));
                    allProducts = JSON.parse(raw).map(normalize);
                    const nuevos = allProducts.filter(p => !antes.has(String(p.id)));
                    renderCats();
                    applyFilter(false);
                    resaltarNuevo();
                    if (!primera && nuevos.length) resaltarId(String(nuevos[nuevos.length - 1].id));
                }
                lastRaw = raw;
            } catch (e) { /* sin conexión al servidor local: se reintenta */ }
        }
        // En tu PC se revisa cada 3 s (para ver al instante lo que cargás con el Gestor);
        // online alcanza con 1 vez por minuto, y solo si la pestaña está a la vista.
        const ES_LOCAL = ['localhost', '127.0.0.1', '[::1]', ''].includes(location.hostname);
        setInterval(() => { if (!document.hidden) pollProducts(); }, ES_LOCAL ? 3000 : 60000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) pollProducts(); });

        fetchProducts();
    
        // Clima según tu ubicación (Open-Meteo: gratis y sin clave). Se refresca cada 15 min.
        // 1) Ubicación aproximada por IP (sin pedir permiso) -> 2) Buenos Aires.
        // Tocando el cartelito se puede elegir una provincia a mano (queda guardada).
        // Si no hay conexión, el cartelito se oculta solo y la tienda sigue igual.
        const PROVINCIAS = [
            ['Ciudad de Buenos Aires', -34.61, -58.38], ['Buenos Aires (provincia)', -34.92, -57.95],
            ['Catamarca', -28.47, -65.78], ['Chaco', -27.45, -58.99], ['Chubut', -43.30, -65.10],
            ['Córdoba', -31.42, -64.18], ['Corrientes', -27.47, -58.83], ['Entre Ríos', -31.73, -60.53],
            ['Formosa', -26.18, -58.17], ['Jujuy', -24.19, -65.30], ['La Pampa', -36.62, -64.29],
            ['La Rioja', -29.41, -66.86], ['Mendoza', -32.89, -68.83], ['Misiones', -27.37, -55.90],
            ['Neuquén', -38.95, -68.06], ['Río Negro', -40.81, -63.00], ['Salta', -24.78, -65.41],
            ['San Juan', -31.54, -68.54], ['San Luis', -33.30, -66.34], ['Santa Cruz', -51.62, -69.22],
            ['Santa Fe', -31.63, -60.70], ['Santiago del Estero', -27.79, -64.26],
            ['Tierra del Fuego', -54.80, -68.30], ['Tucumán', -26.81, -65.22]
        ];
        let CLIMA = { lat: -34.61, lon: -58.38, ciudad: 'Buenos Aires' };
        const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
        const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

        function climaEmoji(code, esDia) {
            if (code === 0) return esDia ? '\u2600\uFE0F' : '\uD83C\uDF19';          // despejado: sol / luna
            if (code === 1) return esDia ? '\uD83C\uDF24\uFE0F' : '\uD83C\uDF19';   // mayormente despejado
            if (code === 2) return esDia ? '\u26C5' : '\u2601\uFE0F';                 // parcialmente nublado
            if (code === 3) return '\u2601\uFE0F';                                      // nublado
            if (code === 45 || code === 48) return '\uD83C\uDF2B\uFE0F';              // niebla
            if (code >= 51 && code <= 57) return '\uD83C\uDF26\uFE0F';                // llovizna
            if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return '\uD83C\uDF27\uFE0F'; // lluvia
            if ((code >= 71 && code <= 77) || code === 85 || code === 86) return '\u2744\uFE0F';       // nieve
            if (code >= 95) return '\u26C8\uFE0F';                                      // tormenta
            return '\u26C5';
        }

        async function actualizarClima() {
            const box = document.getElementById('weather');
            try {
                const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + CLIMA.lat +
                    '&longitude=' + CLIMA.lon + '&current=temperature_2m,weather_code,is_day&timezone=auto';
                const r = await fetch(url);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const c = (await r.json()).current;
                if (!c || typeof c.temperature_2m !== 'number') throw new Error('sin datos');
                document.getElementById('wIco').textContent = climaEmoji(c.weather_code, c.is_day === 1);
                document.getElementById('wTemp').textContent = Math.round(c.temperature_2m) + '\u00B0C';
                document.getElementById('wCity').textContent = CLIMA.ciudad;
                box.title = CLIMA.ciudad + ': ' + Math.round(c.temperature_2m) + '\u00B0C \u2014 tocá para cambiar de provincia';
                box.hidden = false;
            } catch (e) { /* sin conexión: se deja como estaba */ }
        }

        function nombreLugar(ciudad, prov) {
            prov = (prov || '').replace(/^Provincia de /i, '').replace(/^Ciudad Autónoma de /i, '').trim();
            ciudad = (ciudad || '').trim();
            if (ciudad && prov && ciudad.toLowerCase() !== prov.toLowerCase()) return ciudad + ', ' + prov;
            return ciudad || prov || 'Tu ubicación';
        }

        // Ubicación aproximada por IP: no pide ningún permiso al visitante.
        // Se guarda 6 horas para no consultar el servicio en cada visita.
        async function ubicarPorIP() {
            try {
                const c = JSON.parse(lsGet('nexos_ip') || 'null');
                if (c && c.t && Date.now() - c.t < 6 * 3600 * 1000 && typeof c.lat === 'number') return c;
            } catch (e) {}
            let loc = null;
            try {
                const r = await fetch('https://ipwho.is/');
                const d = await r.json();
                if (d && d.success !== false && typeof d.latitude === 'number')
                    loc = { lat: d.latitude, lon: d.longitude, ciudad: nombreLugar(d.city, d.region) };
            } catch (e) {}
            if (!loc) {   // respaldo
                try {
                    const r = await fetch('https://get.geojs.io/v1/ip/geo.json');
                    const d = await r.json();
                    const lat = parseFloat(d.latitude), lon = parseFloat(d.longitude);
                    if (isFinite(lat) && isFinite(lon)) loc = { lat, lon, ciudad: nombreLugar(d.city, d.region) };
                } catch (e) {}
            }
            if (loc) lsSet('nexos_ip', JSON.stringify(Object.assign({ t: Date.now() }, loc)));
            return loc;
        }

        let tokenUbic = 0;
        async function resolverUbicacion() {
            const mi = ++tokenUbic;   // si el usuario cambia de opción mientras se detecta, se descarta lo viejo
            const v = document.getElementById('wSel').value;
            if (v !== 'auto') {
                const p = PROVINCIAS[+v];
                CLIMA = { lat: p[1], lon: p[2], ciudad: p[0] };
                return actualizarClima();
            }
            const l = await ubicarPorIP();
            if (mi !== tokenUbic) return;
            if (l) CLIMA = l;          // si no hay datos, queda Buenos Aires por defecto
            actualizarClima();
        }

        (function iniciarClima() {
            const sel = document.getElementById('wSel');
            const o = document.createElement('option');
            o.value = 'auto'; o.textContent = '\uD83D\uDCCD Mi zona (automática)';
            sel.appendChild(o);
            PROVINCIAS.forEach((p, i) => {
                const op = document.createElement('option');
                op.value = String(i); op.textContent = p[0];
                sel.appendChild(op);
            });
            const guardada = lsGet('nexos_clima');
            sel.value = (guardada && sel.querySelector('option[value="' + guardada + '"]')) ? guardada : 'auto';
            sel.addEventListener('change', () => { lsSet('nexos_clima', sel.value); resolverUbicacion(); });
            resolverUbicacion();
        })();
        setInterval(actualizarClima, 15 * 60 * 1000);
    
        // Cotización del dólar (DolarApi.com: gratis y sin clave). Se refresca cada 5 min.
        // Corre de derecha a izquierda; se frena al pasar el mouse o tocar. Sin conexión: se oculta.
        const DOLARES = [['oficial', 'Oficial'], ['blue', 'Blue'], ['bolsa', 'MEP'],
                         ['contadoconliqui', 'CCL'], ['tarjeta', 'Tarjeta']];
        const fmtUSD = n => '$' + new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 }).format(n);
        function dolarItems(lista) {
            const items = [];
            DOLARES.forEach(([casa, nombre]) => {
                const d = lista.find(x => x && x.casa === casa);
                if (!d || !(d.venta > 0)) return;
                const valor = d.compra > 0 ? fmtUSD(d.compra) + ' <span class="t-sep">/</span> ' + fmtUSD(d.venta)
                                           : fmtUSD(d.venta);
                items.push('<span class="t-item"><span class="t-name">' + nombre + '</span>' +
                           '<span class="t-val">' + valor + '</span></span>');
            });
            return items;
        }
        async function actualizarDolar() {
            const box = document.getElementById('ticker');
            try {
                const r = await fetch('https://dolarapi.com/v1/dolares');
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const lista = await r.json();
                const items = Array.isArray(lista) ? dolarItems(lista) : [];
                if (!items.length) throw new Error('sin datos');
                const set = '<div class="t-set">' + items.join('') + '</div>';
                const track = document.getElementById('tTrack');
                // dos copias iguales: al llegar a -50% vuelve a 0 sin saltos
                track.innerHTML = set + '<div class="t-set t-dup" aria-hidden="true">' + items.join('') + '</div>';
                const fechas = lista.map(x => x && x.fechaActualizacion).filter(Boolean).sort();
                const ult = fechas.length ? new Date(fechas[fechas.length - 1]) : null;
                box.title = 'Dólar (compra / venta)' + (ult && !isNaN(ult) ? ' · act. ' +
                    ult.toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '') +
                    ' · DolarApi.com · Tocá para pausar / reanudar';
                box.hidden = false;
                // velocidad constante (~45 px/s) sin importar cuánto texto haya
                const ancho = track.firstElementChild.getBoundingClientRect().width;
                const vel = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 28 : 45;  // px/s
                track.style.setProperty('--t-dur', Math.max(12, ancho / vel) + 's');
            } catch (e) { /* sin conexión: se deja como estaba */ }
        }
        // Clic / toque / Enter: pausa y reanuda (la gente que prefiere menos movimiento puede frenarlo).
        (function () {
            const t = document.getElementById('ticker');
            const alternar = () => { t.classList.toggle('pausado'); };
            t.addEventListener('click', alternar);
            t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alternar(); } });
        })();
        actualizarDolar();
        setInterval(actualizarDolar, 5 * 60 * 1000);
    </script>
</body>
